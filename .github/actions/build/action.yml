inputs:
  dist:
    description: 'Dist to build'
    default: 'sid'
  arch:
    description: 'Target architecture (amd64 | arm64)'
    required: true
  is_latest:
    description: The created dist is also latest
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Fix for Ubuntu Xenial apt-daily.service triggering
      run: |
        while sudo fuser /var/{lib/{dpkg,apt/lists},cache/apt/archives}/lock >/dev/null 2>&1; do
          sleep 1
        done
      shell: bash
    - run: sudo make .installed-requirements
      shell: bash
    - name: "Clean build directory"
      run: |
        echo "Cleaning build directory to prevent permission conflicts"
        sudo rm -rf build/ || true
        mkdir -p build/
      shell: bash
    - name: "Build image"
      run: |
        set -x
        echo "Building ${{ inputs.dist }} for ${{ inputs.arch }}"
        sudo -E bash -x buildone "${{ inputs.dist }}" "${{ inputs.arch }}"
        if ${{ inputs.is_latest }} ; then
          BASENAME=${BASENAME:?Undefined or empty BASENAME}
          docker tag "$BASENAME:${{ inputs.dist }}-${{ inputs.arch }}" "$BASENAME:latest-${{ inputs.arch }}"
        fi
      shell: bash
    - name: "Fix build permissions"
      run: |
        echo "Fixing permissions on build directory to prevent future conflicts"
        if [ -d "build" ]; then
          sudo chown -R $USER:$USER build/ || true
          sudo chmod -R u+rw build/ || true
        fi
      shell: bash
