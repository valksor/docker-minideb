name: CD

# Controls when the action will run.
on:
  # Triggers the workflow on push on the master branch
  push:
    branches:
      - valksor
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * *'
permissions:
  contents: read
  packages: write
env:
  BASENAME: valksor/minideb
  LATEST: sid
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  shellcheck:
    # The type of runner that the job will run on
    runs-on: self-arm
    name: Shellcheck
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y shellcheck
      - name: Verify scripts with shellcheck
        run: |
          bash shellcheck
  build:
    runs-on: ${{ matrix.arch.runner }}
    needs: [ shellcheck ]
    strategy:
      fail-fast: false
      matrix:
        dist: [trixie, sid]
        arch:
          - { name: amd64, runner: ubuntu-latest }
          - { name: arm64, runner: self-arm }
    name: Build ${{ matrix.dist }} on ${{ matrix.arch.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use local build action
        id: build
        uses: ./.github/actions/build
        with:
          dist: "${{ matrix.dist }}"
          arch: "${{ matrix.arch.name }}"
          is_latest: ${{ matrix.dist == env.LATEST }}
      - name: Push to GitHub Container Registry
        if: github.ref == 'refs/heads/valksor'
        env:
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_REGISTRY: ghcr.io
        run: |
          bash pushone "${{ matrix.dist }}" "${{ matrix.arch.name }}"
          if ${{ matrix.dist == env.LATEST }} ; then
             bash pushone "latest" "${{ matrix.arch.name }}"
          fi
  deploy_manifests:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.ref == 'refs/heads/valksor'
    steps:
      - uses: actions/checkout@v6
      - name: Push manifest lists to GitHub Container Registry
        env:
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_REGISTRY: ghcr.io
        run: |
          DISTS="trixie sid latest" bash pushmanifest
